# Точка входа UCM для звуковой карты "samsung-gta2slte".
#
# ALSA ищет файл по имени карты: conf.d/<имя>/<имя>.conf,
# где <имя> — это model из узла &sound в DTS.
# У нас model = "samsung-gta2slte", отсюда и путь.

Syntax 6

SectionUseCase."HiFi" {
	File "/Samsung/gta2slte/HiFi.conf"
	Comment "Play and record HiFi quality Music"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

# Стартовые уровни. Регистры те же, что у остальных устройств на
# внутреннем кодеке WCD: RX1/RX2 — левый и правый каналы наушников,
# RX3 — тракт, который на других платах уходит на динамик.
# ADC1/ADC2/ADC3 — аналоговое усиление микрофонов; по стоковой
# маршрутизации T385 это AMIC1 (основной), AMIC3 (гарнитура),
# AMIC2 (второй) соответственно.
BootSequence [
	# Наушники и разговорный динамик
	cset "name='RX1 Digital Volume' 88"
	cset "name='RX2 Digital Volume' 88"

	# Тракт RX3 — оставлен на штатном уровне; на этой плате он ведёт
	# к внешнему усилителю на primary MI2S, который пока не опознан.
	cset "name='RX3 Digital Volume' 88"

	# Основной микрофон (AMIC1)
	cset "name='ADC1 Volume' 6"
	# Микрофон гарнитуры (AMIC3)
	cset "name='ADC2 Volume' 6"
	# Второй микрофон (AMIC2)
	cset "name='ADC3 Volume' 6"
]
