# ALSA UCM — Samsung Galaxy Tab A 8.0 (2017) LTE, SM-T385 (gta2slte)
#
# Описывает, как PipeWire/PulseAudio должны переключать тракты звуковой
# карты "samsung-gta2slte" (qcom,msm8916-qdsp6-sndcard на MSM8917).
#
# Последовательности регистров кодека берутся из общей библиотеки
# codecs/msm8953-wcd, которая идёт в пакете soc-qcom-msm89x7-ucm.
# Имя msm8953 в ней историческое: это тот же внутренний кодек WCD,
# что стоит в PM8937 у msm8917 (в стоке Samsung он зовётся cajon).
#
# Составлено по стоковой маршрутизации T385:
#   AMIC1 = Handset Mic (основной), AMIC2 = Secondary Mic,
#   AMIC3 = Headset Mic. Детект гарнитуры GPIO 61, кнопка GPIO 93.
#
# ДИНАМИКА здесь нет намеренно. В стоке qcom,msm-ext-pa = "primary":
# динамик висит на внешнем усилителе по primary MI2S, а сам усилитель
# в стоковом DTS не описан — ни устройства на I2C, ни GPIO включения.
# Пока он не опознан на живом устройстве, секция Speaker создавала бы
# видимость работающего выхода, из которого не идёт звук.
# Порядок опознания расписан в DTS, рядом с закомментированным
# блоком speaker_amp.

SectionVerb {
	EnableSequence [
		cset "name='MultiMedia1 Mixer PRI_MI2S_TX' 0"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"

		# Разговорный тракт: модем отдаёт звук звонка в отдельный
		# PCM VoiceMMode1, поэтому его нужно свести с теми же
		# точками, что и музыку — иначе в звонке тишина в обе
		# стороны. Включаем сразу: отдельный режим для звонка не
		# нужен, тракт простаивает, пока звонка нет.
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	# Основной динамик: внешний усилитель без шины управления снимает
	# встроенный каскад класса D кодека (SPK_OUT); его питающий буст
	# включает наш патч ядра 0005 — в mainline он не включался вовсе.
	# Никаких внешних усилителей и GPIO у динамика нет — вопреки
	# нескольким ложным следам в шаблонных ветках стокового дерева.
	EnableSequence [
		# Пересброс маршрута лечит зависший поток MultiMedia1: циклы
		# закрытия/открытия PCM подвешивают его в ADSP (звук молча
		# пропадает при исправных регистрах). Проверено на живом
		# устройстве: выкл/вкл возвращает звук немедленно.
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX3 MIX1 INP1' RX1"
		# Второй вход микшера — правый канал: динамики моно, и без
		# этого правый канал стереопотока просто пропадал (в тестах
		# каналов «правый динамик не работает»).
		cset "name='RX3 MIX1 INP2' RX2"
		# 108 = +24 дБ: компенсация потери сгоревшего буста
		cset "name='RX3 Digital Volume' 108"
		# Нижний динамик (SPK, класс D с бустом) НЕ включаем: буст
		# сгорел (25.08.2026), и вскоре после него умер и сам каскад —
		# при идеальных регистрах и байпасе тишина. Аппаратная потеря.
		cset "name='SPK DAC Switch' 0"
		cset "name='LINEOUT DAC Switch' 1"
		# ЕДИНСТВЕННЫЙ ЖИВОЙ ИЗЛУЧАТЕЛЬ. Проверено 28.08.2026
		# ровным тоном по очереди: с выключенным EAR_S тишина
		# при включённом LINEOUT, и наоборот — звук есть. То есть
		# громкий выход молчит так же, как и нижний динамик, а всё
		# звучание планшета идёт через щель у экрана. Строки RX3
		# и LINEOUT ниже оставлены на случай починки железа.
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RDAC2 MUX' RX1"
		cset "name='RX1 Digital Volume' 96"
		cset "name='EAR_S' 1"

		# НАСТОЯЩИЙ ГРОМКОГОВОРИТЕЛЬ. Им управляет отдельный
		# усилитель NXP TFA9890 на четверичном MI2S — к кодеку
		# динамик не подключён вовсе. Заработал 28.08.2026 после
		# двух правок ядра: в mainline четверичному порту выдавался
		# тактовый сигнал третичного, и у msm8917 мультиплексору
		# не хватало одного бита. Разговорный динамик оставлен
		# включённым: он звучит вместе с основным и добавляет
		# громкости.
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Speaker Switch' 1"
	]
	DisableSequence [
		cset "name='SPK DAC Switch' 0"
		cset "name='LINEOUT DAC Switch' 0"
		cset "name='RX3 MIX1 INP1' ZERO"
		cset "name='RX3 MIX1 INP2' ZERO"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		# Моно: правый канал стереопотока до кодека не доезжает
		# (подмешивание RX2 в RX3 MIX результата не дало), поэтому
		# сведение стерео в один канал отдано звуковому серверу —
		# он делает это до железа, и оба канала слышны.
		PlaybackChannels 1
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	ConflictingDevice [
		"Headphones"
	]

	Include.ees.File "/codecs/msm8953-wcd/EarpieceEnableSeq.conf"
	Include.eds.File "/codecs/msm8953-wcd/EarpieceDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		PlaybackChannels 1
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	ConflictingDevice [
		"Earpiece"
	]

	Include.hpes.File "/codecs/msm8953-wcd/HeadphonesEnableSeq.conf"
	Include.hpds.File "/codecs/msm8953-wcd/HeadphonesDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 2
		# Детект вставки гарнитуры даёт MBHC аналогового кодека
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Primary Microphone"

	ConflictingDevice [
		"Headset"
		"Mic2"
	]

	Include.pmes.File "/codecs/msm8953-wcd/PrimaryMicEnableSeq.conf"
	Include.pmds.File "/codecs/msm8953-wcd/PrimaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 300
	}
}

SectionDevice."Mic2" {
	Comment "Secondary Microphone"

	ConflictingDevice [
		"Headset"
		"Mic1"
	]

	Include.smes.File "/codecs/msm8953-wcd/SecondaryMicEnableSeq.conf"
	Include.smds.File "/codecs/msm8953-wcd/SecondaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 200
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	Include.hmes.File "/codecs/msm8953-wcd/HeadsetMicEnableSeq.conf"
	Include.hmds.File "/codecs/msm8953-wcd/HeadsetMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 150
		JackControl "Mic Jack"
	}
}
