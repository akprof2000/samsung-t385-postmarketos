# SM-T385: датчик Холла чехла даёт SW_LID (ядро r55+).
#
# Закрыли чехол — планшет засыпает (s2idle). Разбудить можно кнопкой
# питания или открытием чехла: сам датчик объявлен источником
# пробуждения в device tree.
#
# Сон заработал с ядра r56: до него системный suspend срывал драйвер
# автофокуса — он лез к актуатору по I2C, когда шина CCI уже
# обесточена (её подтяжки питаются от камерного VIO).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
