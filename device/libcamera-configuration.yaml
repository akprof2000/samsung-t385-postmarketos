---
version: 1
configuration:
  software_isp:
    # Сборку цвета делает процессор, а не видеоядро.
    #
    # Путь через видеоядро (DebayerEGL) на этом чипе рушит службу
    # звука и видео: контекст EGL создаётся в одном потоке, а кадр
    # обрабатывается в другом, и libcamera обрывает работу по
    #   egl.cpp:474 "tid_ == Thread::currentId()" failed in makeCurrent()
    # WirePlumber падает, узлы камер исчезают, приложение пишет
    # «не удалось воспроизвести потоковые данные с камеры».
    #
    # Процессор к тому же быстрее: на 2048x1536 он даёт 30 кадров в
    # секунду против 25 у видеоядра, на 1632x1224 — 30 против 21.
    mode: cpu
