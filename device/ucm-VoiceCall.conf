# Профиль разговора — Samsung SM-T385 (gta2slte)
#
# Отдельный режим нужен по двум причинам.
#
# Первая: разговорный звук идёт мимо обычного микшера. Модем и кодек
# соединяются внутри звукового сопроцессора через поток VoiceMMode1,
# и тракт поднимается только когда этот поток открыт. Здесь мы сводим
# его вниз (в наушник/динамик) и вверх (микрофон), а сам поток держит
# открытым служба t385-callaudio.
#
# Вторая: без этого профиля оболочка звонков не даёт нажать «громкую
# связь» и «выключить микрофон» — она переключает их через callaudiod,
# а тот работает только с режимом "Voice Call".
#
# Разговорная частота — 8 кГц, как отдаёт модем.

# ВАЖНО про номера потоков: здесь указаны обычные PCM (0 — вывод,
# 1 — запись), а не голосовой VoiceMMode1. Разговорный звук через них
# не течёт — модем и кодек соединяет сам сопроцессор. Но система звука
# обязана видеть исправные вход и выход: иначе callaudiod пишет
# "card has no usable sink", и в интерфейсе звонка кнопки громкой
# связи и микрофона остаются неактивными. Голосовой поток открывает
# служба t385-callaudio — этим и поднимается разговорный тракт.

SectionVerb {
	EnableSequence [
		# Разговорный тракт: вниз через тот же путь, что и музыка,
		# вверх — с микрофонного порта кодека.
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 1"

		# Микрофон: основной (AMIC1) через первый АЦП.
		cset "name='DEC1 MUX' ADC1"
		cset "name='CIC1 MUX' AMIC"
		cset "name='ADC1 Volume' 8"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Разговорный динамик"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	Include.ees.File "/codecs/msm8953-wcd/EarpieceEnableSeq.conf"
	Include.eds.File "/codecs/msm8953-wcd/EarpieceDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		PlaybackChannels 1
	}
}

SectionDevice."Speaker" {
	Comment "Громкая связь"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	# Тот же обход, что и в музыкальном профиле: у планшета сгорел
	# буст нижнего динамика, поэтому громкая связь идёт через
	# LINEOUT с поднятым уровнем RX3.
	EnableSequence [
		cset "name='RX3 MIX1 INP1' RX1"
		cset "name='RX3 MIX1 INP2' RX2"
		cset "name='RX3 Digital Volume' 108"
		cset "name='LINEOUT Volume' 1"
	]

	DisableSequence [
		cset "name='LINEOUT Volume' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 1
	}
}

SectionDevice."Headphones" {
	Comment "Наушники"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	Include.hpes.File "/codecs/msm8953-wcd/HeadphonesEnableSeq.conf"
	Include.hpds.File "/codecs/msm8953-wcd/HeadphonesDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Микрофон разговора"

	ConflictingDevice [
		"Headset"
	]

	Include.pmes.File "/codecs/msm8953-wcd/PrimaryMicEnableSeq.conf"
	Include.pmds.File "/codecs/msm8953-wcd/PrimaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 300
	}
}

SectionDevice."Headset" {
	Comment "Микрофон гарнитуры"

	ConflictingDevice [
		"Mic1"
	]

	Include.hmes.File "/codecs/msm8953-wcd/HeadsetMicEnableSeq.conf"
	Include.hmds.File "/codecs/msm8953-wcd/HeadsetMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 200
		JackControl "Headset Mic Jack"
	}
}
