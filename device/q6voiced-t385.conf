# Штатная настройка msm89x7 указывает голосовой поток номером 4.
# На этой карте VoiceMMode1 — устройство 6, а четвёртого нет вовсе:
# служба не могла открыть тракт передачи, и собеседник не слышал
# ничего. В журнале это лежало открытым текстом:
#   q6voiced: Failed to open tx: No such file or directory
#
# Микшеры голосового тракта включаем заранее: пока они сброшены,
# голосовой поток не открывается вообще (недопустимый аргумент),
# и разговора нет ни в одну сторону.
[Service]
ExecStartPre=/usr/bin/amixer -c 0 -q cset name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1
ExecStartPre=/usr/bin/amixer -c 0 -q cset name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 1
ExecStart=
ExecStart=/usr/bin/q6voiced hw:0,6
